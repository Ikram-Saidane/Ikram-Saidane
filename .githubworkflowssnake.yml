name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight UTC
  workflow_dispatch:      # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths-ignore: ["README.md"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Draw the snake from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#D2042D&color_dots=#F3E3E6,#FFB3C1,#FF6F8E,#D2042D,#6C1026
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF8FA6&color_dots=#161B22,#4A0816,#6C1026,#D2042D,#FF8FA6

      - name: Publish the images to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
